[project]
name = "omnichat-backend"
version = "0.1.0"
description = "Backend API for OmniChat - AI Chat and Knowledge Assistant"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "celery[redis]>=5.6.3",
    "django>=5.2.17",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.0",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "openai>=3.5.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "reportlab>=5.0.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.uv.workspace]
members = [
    "Documents/Orchestrix/backend",
    "Documents/Geointel/backend",
]